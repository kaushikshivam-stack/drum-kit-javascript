<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Drum-Kit</title>

  <link rel="stylesheet" href="styles.css">

  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="images/drum-kit.png">

</head>

<body>

  <h1 id="title">Drum 🥁 Kit</h1>

  <p class="instructions" id="current-key">
    Click the drums or press W A S D J K L on your keyboard to play sounds 🎵
  </p>

  <p id="hit-counter">Drum Hits: 0</p>

  <div class="set">

    <button class="drum w">w</button>
    <button class="drum a">a</button>
    <button class="drum s">s</button>
    <button class="drum d">d</button>
    <button class="drum j">j</button>
    <button class="drum k">k</button>
    <button class="drum l">l</button>

  </div>

  <footer>
    Made with ❤️ in India | Drum Kit Project
  </footer>

  <script src="index.js"></script>

</body>
</html>
